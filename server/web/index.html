<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>State of Me · 此刻</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><a class="brand" href="./">State of Me<span>个人状态台</span></a><details id="connection"><summary>连接设置</summary><form id="auth"><label for="token">只读访问令牌</label><input id="token" type="password" autocomplete="off" placeholder="输入令牌以查看已授权的状态"><p class="hint">仅保存在本页内存，断开即清除。</p><div class="actions"><button>连接</button><button type="button" id="public" class="secondary">查看公开状态</button><button type="button" id="forget" class="secondary">断开</button></div></form></details></header><section class="intro"><div><h1>此刻的状态</h1><p>留一点空间，给正在发生的事。</p></div><p id="notice" role="status">尚未连接，请打开连接设置。</p></section><section id="cards" aria-label="设备状态"></section><section id="empty"><div class="empty-mark" aria-hidden="true">—</div><h2>等待一个新的此刻</h2><p id="empty-copy">在连接设置中输入只读令牌，或查看已公开的状态。</p></section><footer><span>只展示主动分享的内容</span><span>播放状态来自设备，不能代表本人一定正在听。</span></footer></main><script src="playback.js"></script><script src="ui.js"></script></body></html>
