name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - run: bash clients/android/gradlew -p clients/android assembleDebug --console=plain
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r server/requirements.txt httpx
      - run: python -m unittest server.test_app server.test_accounts integrations.astrbot.test_identity integrations.astrbot.test_adapter -v
      - run: node server/test_playback.cjs
      - run: node server/test_widget.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: |
          mkdir -p /tmp/lyrics-test
          javac -encoding UTF-8 -d /tmp/lyrics-test clients/android/src/io/github/stateofme/Lyrics.java clients/android/tests/LyricsTest.java
          java -cp /tmp/lyrics-test LyricsTest
          javac -d /tmp/lyrics-test clients/android/src/io/github/stateofme/UpdateTiming.java clients/android/tests/UpdateTimingTest.java
          java -cp /tmp/lyrics-test UpdateTimingTest
          javac -d /tmp/lyrics-test clients/android/src/io/github/stateofme/PublishPolicy.java clients/android/tests/PublishPolicyTest.java
          java -cp /tmp/lyrics-test PublishPolicyTest
          javac -encoding UTF-8 -d /tmp/lyrics-test clients/android/src/io/github/stateofme/AppFilter.java clients/android/tests/AppFilterTest.java
          java -cp /tmp/lyrics-test AppFilterTest
          javac -encoding UTF-8 -d /tmp/lyrics-test clients/android/src/io/github/stateofme/EmbeddedLyrics.java clients/android/src/io/github/stateofme/TrackMatch.java clients/android/src/io/github/stateofme/Lyrics.java clients/android/tests/EmbeddedLyricsTest.java
          java -cp /tmp/lyrics-test EmbeddedLyricsTest
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build clients/windows -c Release
      - run: dotnet run --project tests/windows -c Release
